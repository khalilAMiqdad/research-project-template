# Markdown lint rules (used by CI and editors)
config:
  default: true
  MD013: false          # line length — off (tables, Arabic text)
  MD024:
    siblings_only: true # duplicate headings allowed in different sections (CHANGELOG)
  MD033: false          # inline HTML allowed (<div dir="rtl"> for Arabic)
  MD036: false          # emphasis used as heading allowed in templates
  MD041: false          # first line need not be a heading (templates with front matter)
  MD060: false          # table column style
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
  - ".venv/**"
  - "99_archive/**"
  - ".github/ISSUE_TEMPLATE/**"
