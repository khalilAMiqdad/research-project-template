name: "🔍 Review Request / طلب مراجعة"
description: "Ask for a methodological, statistical, data or report review"
title: "[Review] "
labels: ["review-required"]
body:
  - type: dropdown
    id: review_type
    attributes:
      label: "Type of review / نوع المراجعة"
      multiple: true
      options: [Methodological, Statistical, Data, Report / language, Security / data protection]
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: "What should be reviewed? / ما المطلوب مراجعته"
      description: "PR number, file paths, or document section."
      placeholder: "PR #45, 01_protocol/ANALYSIS_PLAN.md §8"
    validations:
      required: true
  - type: textarea
    id: focus
    attributes:
      label: "Questions for the reviewer / أسئلة للمراجع"
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: "Needed by / مطلوب قبل"
      placeholder: "YYYY-MM-DD"
  - type: textarea
    id: checklist
    attributes:
      label: "Checklist to apply / قائمة الفحص"
      description: "Paste the relevant section of 06_documentation/quality_control/QC_CHECKLIST.md"
